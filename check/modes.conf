# Gate mode per VM (check/README.md, "Mode per VM"). scripts/run-images.sh reads this file.
#
#   <vm> strict                    status, cpu and mem must equal check/reference/haskell-check.csv
#   <vm> badge:<reference csv>     for a VM whose API cannot take the mainnet cost model: published
#                                  with an "outdated cost model" badge if it equals the reference
#                                  for its own model. Path relative to the repo root
#
# A VM that is not listed is strict. Example:
#   blaze-v8 badge:check/reference/haskell-check-variant-c.csv
