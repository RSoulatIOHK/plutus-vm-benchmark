[package]
name = "aiken_wasm_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Same uplc revision, wasm-bindgen and release profile as the published
# @lucid-evolution/uplc (packages/uplc/rust/Cargo.toml of lucid-evolution).
# The Dockerfile starts from that package's Cargo.lock, so the dependency
# versions match the published build too.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Rev replaced by the Dockerfile with AIKEN_WASM_SHA from .env.
uplc = { git = "https://github.com/colll78/aiken.git", rev = "28e42883b9192d123406d9c8fb79cb2817e98b9c" }
wasm-bindgen = "0.2.93"
# required for wasm usage of getrandom
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
