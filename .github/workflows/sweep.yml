# Deletes bench servers that outlived their run (see scripts/hetzner/sweep.sh).
name: sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: Delete bench servers older than this many hours (0 = all)
        default: "22"

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 10
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '22' }}
        run: nix shell nixpkgs#hcloud nixpkgs#jq --command scripts/hetzner/sweep.sh
