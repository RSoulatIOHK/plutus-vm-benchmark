# The benchmark run: creates a bench server on Hetzner, checks that the server is not slow (server
# qualification, scripts/hetzner/up-qualified.sh), runs every VM image on it, gates the results,
# commits results/<date> and publishes the report on GitHub Pages, and deletes the server.
# A full run uses a ccx43 and 3 lanes (spec D19). A manual run can take a subset (VMs, scripts,
# loops, quick timing), a warm-up trace, or a lane count other than 1 and 3: that is a partial run,
# results/partial-<date>T<time>, never committed or published.
#
# A GitHub-hosted job lasts at most 6 h. A full run takes about 4 h on a ccx43 with 3 lanes and
# about 11 h on a ccx33 with one lane, so the run is detached on
# the server (scripts/hetzner/run-remote.sh) and up to three wait jobs poll it (17 h). The server
# deletes itself 20 h after boot if every job here dies (nix/runner.nix); sweep.yml is the last guard.
name: run

on:
  schedule:
    # The 1st of each month; skipped when nothing but results changed since the last run.
    - cron: "41 2 1 * *"
  workflow_dispatch:
    inputs:
      vms:
        description: VMs to run, space-separated (empty = all)
        default: ""
      scripts:
        description: "Scripts to run: extended regex, full match on the name, e.g. auction_.*|uniswap-1 (empty = all 89)"
        default: ""
      loops:
        description: "Loops, comma-separated: d3 (decode+eval timing), eval (eval-only timing), check"
        default: d3,eval,check
      timing:
        description: Timing length (quick = short warm-up and measurement)
        type: choice
        options: [normal, quick]
        default: normal
      trace:
        description: Log the warm-up slices of the JIT rows into <vm>-warmup.csv (a partial run)
        type: boolean
        default: false
      lanes:
        description: >-
          Parallel lanes: run up to this many VMs at once, each on its own whole cores
          (1 = one VM at a time; 1 and 3 can be a full run, any other value is a partial run).
          A comma list such as 1,3 runs the same VMs once per value on the same server (A/B test),
          into results/<run>/lanes<N>; it is always a partial run
        type: string
        default: "3"
      server_type:
        description: >-
          Hetzner server type (keep it fixed for comparable history). The server must pass the
          qualification against check/reference/host-reference.json; a type without a reference
          skips it. A ccx43 has 16 dedicated vCPUs: the Hetzner project limit must allow it
        default: ccx43
      force:
        description: Run even if nothing changed since the last run
        type: boolean
        default: false
      parallel:
        description: Run beside another run (own server, own concurrency group); for tests only, never published
        type: boolean
        default: false
      variants:
        description: >-
          TEMPORARY (Scalus 1.4.1 preparation): a variants file such as scripts/variants/scalus-141.txt.
          Runs once per line on the same server, into results/<run>/<variant> (scripts/run-variants.sh);
          always a partial run
        default: ""
      publish:
        description: >-
          Commit results/<date> and deploy the page (otherwise the results are only an artifact).
          Only a full run publishes (all VMs, scripts and loops, normal timing, no trace, 1 or 3 lanes);
          a partial run never does
        type: boolean
        default: false

# One run at a time, so scheduled runs never overlap. A manual test run with parallel=true gets its
# own group and runs beside another one, on its own server.
concurrency: ${{ inputs.parallel && format('bench-hetzner-{0}', github.run_id) || 'bench-hetzner' }}

permissions:
  contents: read

env:
  REGISTRY_PREFIX: ghcr.io/lantr-io/pvb-
  BENCH_STATE: /tmp/bench-hetzner

jobs:
  start:
    runs-on: ubuntu-latest
    environment: bench-run
    # Up to 3 servers (server qualification), each about 15 min to install and 5 min to qualify.
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      name: ${{ steps.plan.outputs.name }}
      skip: ${{ steps.plan.outputs.skip }}
      partial: ${{ steps.plan.outputs.partial }}
      ip: ${{ steps.up.outputs.ip }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      BENCH_SERVER_TYPE: ${{ inputs.server_type || 'ccx43' }}
      # A scheduled run has no inputs: every switch takes its full-run default.
      BENCH_SCRIPTS: ${{ inputs.scripts || '' }}
      BENCH_LOOPS: ${{ inputs.loops || 'd3,eval,check' }}
      BENCH_TIMING: ${{ inputs.timing || 'normal' }}
      BENCH_TRACE: ${{ inputs.trace && '1' || '0' }}
      # The lane count of a full run (spec D19). A scheduled run has no inputs and takes it.
      LANES_DEFAULT: "3"
      LANES: ${{ inputs.lanes || '3' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: plan
        env:
          FORCE: ${{ inputs.force || false }}
          EVENT: ${{ github.event_name }}
          VMS: ${{ inputs.vms }}
          # The raw input: LANES (job env) turns an empty input into LANES_DEFAULT.
          LANES_INPUT: ${{ inputs.lanes }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          # Skip a scheduled run when only results/ and the published page (and its sitemap and
          # link-preview image) changed since the last results commit.
          last=$(git log -1 --format=%H -- results/ || true)
          changed=$(git log --format=%h "${last:+$last..}HEAD" -- . ':!results' ':!docs/index.html' \
            ':!docs/sitemap.xml' ':!docs/og.png' | head -1)
          if [[ "$EVENT" == schedule && "$FORCE" != true && -z "$changed" ]]; then
            echo "nothing changed since $last; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check the switches here, before a server costs money (run-images.sh checks them again).
          case "$BENCH_TIMING" in normal | quick) ;; *) echo "::error::timing $BENCH_TIMING"; exit 1 ;; esac
          loops=$(echo "${BENCH_LOOPS//,/ }" | xargs -n1 | sort -u | paste -sd, -)
          for loop in ${loops//,/ }; do
            case "$loop" in d3 | eval | check) ;; *) echo "::error::unknown loop '$loop' in '$BENCH_LOOPS'"; exit 1 ;; esac
          done
          [[ -n "$loops" ]] || { echo "::error::loops is empty"; exit 1; }
          for n in ${LANES//,/ }; do
            [[ "$n" =~ ^[1-9][0-9]*$ ]] || { echo "::error::lanes '$LANES_INPUT': expected whole numbers >= 1, comma separated"; exit 1; }
          done
          all_vms=$(scripts/images.sh list | sort -u | paste -sd' ' -)
          for vm in $VMS; do
            echo "$all_vms" | tr ' ' '\n' | grep -qx -- "$vm" || { echo "::error::unknown VM '$vm'"; exit 1; }
          done
          vms=$(echo "${VMS:-$all_vms}" | xargs -n1 | sort -u | paste -sd' ' -)
          if [[ -n "$VARIANTS" ]]; then
            [[ -f "$VARIANTS" ]] || { echo "::error::variants file '$VARIANTS' does not exist"; exit 1; }
            [[ "$LANES" != *,* ]] || { echo "::error::variants and a lanes comma list do not combine"; exit 1; }
            for vm in $(sed -n 's/.*[[:space:]]VMS=\([^[:space:]]*\).*/\1/p' "$VARIANTS" | tr ',' ' '); do
              echo " $vms " | grep -q " $vm " || { echo "::error::variants file VM '$vm' is not in vms"; exit 1; }
            done
          fi
          if [[ -n "$BENCH_SCRIPTS" ]]; then
            # grep exits 1 for no match, 2 for a bad regex.
            rc=0
            matched=$(printf '%s\n' data/plutus_use_cases/*.flat | sed 's|.*/||; s/\.flat$//' \
              | grep -Ec -- "^(${BENCH_SCRIPTS})\$") || rc=$?
            [[ $rc -le 1 ]] || { echo "::error::scripts '$BENCH_SCRIPTS' is not a valid extended regex"; exit 1; }
            [[ $matched -gt 0 ]] || { echo "::error::scripts '$BENCH_SCRIPTS' matches no script"; exit 1; }
            echo "scripts: $matched match '$BENCH_SCRIPTS'"
          fi
          # Full run: every VM, every script, every loop, normal timing, no trace, and 1 lane or the
          # default lane count (3). A comma list (A/B test) and anything else is partial.
          partial=true
          if [[ "$vms" == "$all_vms" && -z "$BENCH_SCRIPTS" && "$loops" == check,d3,eval && "$BENCH_TIMING" == normal \
            && "$BENCH_TRACE" == 0 && -z "$VARIANTS" && ( "$LANES" == 1 || "$LANES" == "$LANES_DEFAULT" ) ]]; then
            partial=false
          fi
          if [[ "$partial" == true ]]; then
            name="partial-$(date -u +%Y-%m-%dT%H%M)"
          else
            name="$(date -u +%Y-%m-%d)"
            n=2
            while [[ -e "results/$name" ]]; do name="$(date -u +%Y-%m-%d)-$n"; n=$((n + 1)); done
          fi
          {
            echo "skip=false"
            echo "partial=$partial"
            echo "name=$name"
            echo "run_id=run-${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      # Every image must exist at the tag of the checked-out files before we pay for a server.
      - name: Check images
        if: steps.plan.outputs.skip != 'true'
        env:
          VMS: ${{ inputs.vms }}
        run: |
          missing=0
          for vm in ${VMS:-$(scripts/images.sh list)}; do
            image="${REGISTRY_PREFIX}${vm}:$(scripts/images.sh tag "$vm")"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "ok      $image"
            else
              echo "MISSING $image (run the images workflow first)"
              missing=1
            fi
          done
          exit $missing

      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.skip != 'true'

      # Server qualification (spec D18): time the Haskell image on 3 scripts and compare with
      # check/reference/host-reference.json. A server more than 15 % slower is deleted and a new
      # one is created, up to 3 servers; then the run fails.
      - name: Create server, install NixOS, qualify it
        id: up
        if: steps.plan.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.plan.outputs.run_id }}
          SSH_KEY: ${{ secrets.BENCH_SSH_KEY }}
        run: |
          mkdir -p "$BENCH_STATE/$RUN_ID"
          key="$BENCH_STATE/$RUN_ID/id_ed25519"
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$key")
          ssh-keygen -y -f "$key" > "$key.pub"
          nix shell nixpkgs#hcloud nixpkgs#jq --command scripts/hetzner/up-qualified.sh "$RUN_ID"
          echo "ip=$(cat "$BENCH_STATE/$RUN_ID/ip")" >> "$GITHUB_OUTPUT"

      - name: Server qualification summary
        if: always() && steps.plan.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.plan.outputs.run_id }}
        run: |
          state="$BENCH_STATE/$RUN_ID"
          [[ -f "$state/qualify-summary.md" ]] || exit 0
          {
            cat "$state/qualify-summary.md"
            echo ""
            echo "Result: $(cat "$state/qualify.txt" 2>/dev/null || echo 'none (a step failed)')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the run
        if: steps.plan.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.plan.outputs.run_id }}
          NAME: ${{ steps.plan.outputs.name }}
          VMS: ${{ inputs.vms }}
          VARIANTS: ${{ inputs.variants }}
        # VMS is a space-separated list: split it on purpose. PVB_QUALIFY goes to environment.txt.
        run: |
          PVB_QUALIFY="$(cat "$BENCH_STATE/$RUN_ID/qualify.txt" 2>/dev/null || true)"
          export PVB_QUALIFY
          # shellcheck disable=SC2086
          scripts/hetzner/run-remote.sh start "$RUN_ID" "$NAME" $VMS

      - name: Delete server after a failed start
        if: (failure() || cancelled()) && steps.plan.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.plan.outputs.run_id }}
        run: nix shell nixpkgs#hcloud --command scripts/hetzner/down.sh "$RUN_ID"

  wait-1:
    needs: start
    if: needs.start.result == 'success' && needs.start.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 355
    outputs:
      done: ${{ steps.wait.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: wait
        uses: ./.github/actions/wait-run
        with:
          run_id: ${{ needs.start.outputs.run_id }}
          ip: ${{ needs.start.outputs.ip }}
          ssh_key: ${{ secrets.BENCH_SSH_KEY }}
          minutes: "345"

  wait-2:
    needs: [start, wait-1]
    if: needs.start.result == 'success' && needs.wait-1.result == 'success' && needs.wait-1.outputs.done != 'true' && !cancelled()
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 355
    outputs:
      done: ${{ steps.wait.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: wait
        uses: ./.github/actions/wait-run
        with:
          run_id: ${{ needs.start.outputs.run_id }}
          ip: ${{ needs.start.outputs.ip }}
          ssh_key: ${{ secrets.BENCH_SSH_KEY }}
          minutes: "345"

  wait-3:
    needs: [start, wait-2]
    if: needs.start.result == 'success' && needs.wait-2.result == 'success' && needs.wait-2.outputs.done != 'true' && !cancelled()
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 355
    outputs:
      done: ${{ steps.wait.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: wait
        uses: ./.github/actions/wait-run
        with:
          run_id: ${{ needs.start.outputs.run_id }}
          ip: ${{ needs.start.outputs.ip }}
          ssh_key: ${{ secrets.BENCH_SSH_KEY }}
          minutes: "345"

  finish:
    needs: [start, wait-1, wait-2, wait-3]
    if: always() && needs.start.outputs.skip == 'false' && needs.start.outputs.ip != ''
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      RUN_ID: ${{ needs.start.outputs.run_id }}
      NAME: ${{ needs.start.outputs.name }}
      PARTIAL: ${{ needs.start.outputs.partial }}
      # A scheduled run always publishes; a manual run only when asked, and never a partial run.
      PUBLISH: ${{ (github.event_name == 'schedule' || (inputs.publish && !inputs.parallel)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect results
        id: collect
        continue-on-error: true
        env:
          IP: ${{ needs.start.outputs.ip }}
          SSH_KEY: ${{ secrets.BENCH_SSH_KEY }}
        run: |
          mkdir -p "$BENCH_STATE/$RUN_ID"
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$BENCH_STATE/$RUN_ID/id_ed25519")
          echo "$IP" > "$BENCH_STATE/$RUN_ID/ip"
          status=$(scripts/hetzner/run-remote.sh status "$RUN_ID")
          echo "run status: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          scripts/hetzner/run-remote.sh collect "$RUN_ID" "$NAME"

      - uses: cachix/install-nix-action@v31
        if: always()

      - name: Delete server
        if: always()
        run: nix shell nixpkgs#hcloud --command scripts/hetzner/down.sh "$RUN_ID"

      - uses: actions/upload-artifact@v4
        if: steps.collect.outcome == 'success'
        with:
          name: results-${{ needs.start.outputs.name }}
          path: results/${{ needs.start.outputs.name }}

      - name: Commit results
        id: commit
        if: steps.collect.outcome == 'success' && env.PARTIAL == 'false' && env.PUBLISH == 'true'
        run: |
          git config user.name "plutus-vm-bench"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The published page: the same report as results/$NAME/index.html, written to docs/, with
          # docs/robots.txt, docs/sitemap.xml and docs/og.png (the link preview, a screenshot by the
          # runner's google-chrome; without Chrome the committed og.png stays).
          python3 report/generate_report.py --write-index "results/$NAME" > /dev/null
          git add "results/$NAME" docs/index.html docs/robots.txt docs/sitemap.xml docs/og.png
          git commit -m "results: $NAME"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Partial results are still committed above (one failed VM must not hide the others), but
      # the job must not look green when the run or the collection failed.
      - name: Fail if the run failed
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          STATUS: ${{ steps.collect.outputs.status }}
        run: |
          if [[ "$COLLECT" != success ]]; then echo "collecting the results failed"; exit 1; fi
          if [[ "$STATUS" != done:0 ]]; then echo "the run ended with $STATUS (see results/<name>/run.log)"; exit 1; fi

  pages:
    needs: finish
    # always(): wait-2/wait-3 are skipped in a normal run, and a skipped job anywhere upstream
    # makes the default success() false, which skipped this job on 2026-10-23.
    if: always() && needs.finish.result == 'success' && needs.finish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      # Publish only the page and its assets, not the internal docs (specs, contracts) in docs/.
      - name: Collect site files
        run: |
          mkdir -p _site
          cp docs/index.html docs/favicon.svg docs/og.png docs/robots.txt docs/sitemap.xml \
             docs/lantr-logo.png docs/lantr-logo-dark.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
