# Creates a bench server, installs nix/runner.nix, checks it, deletes it. No benchmarks run.
# Use it after changing nix/ or scripts/hetzner/.
name: provision-test

on:
  workflow_dispatch:
    inputs:
      server_type:
        description: Hetzner server type
        default: cx33
      test_selfdestruct:
        description: Shorten the self-destruct timer to 90 s and check the server deletes itself
        type: boolean
        default: false

concurrency: bench-hetzner

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: bench-run
    timeout-minutes: 45
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      BENCH_SERVER_TYPE: ${{ inputs.server_type }}
      RUN_ID: test-${{ github.run_id }}
      BENCH_STATE: /tmp/bench-hetzner
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Create server and install NixOS
        run: nix shell nixpkgs#hcloud nixpkgs#jq --command scripts/hetzner/up.sh "$RUN_ID"

      - name: Check the installed system
        run: |
          IP=$(cat "$BENCH_STATE/$RUN_ID/ip")
          ssh -i "$BENCH_STATE/$RUN_ID/id_ed25519" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null "root@$IP" '
            set -e
            grep -q "^NAME=NixOS" /etc/os-release
            docker run --rm hello-world >/dev/null
            systemctl is-active bench-selfdestruct.timer
            test "$(stat -c %a /var/lib/bench/hcloud-token)" = 400
            nproc; free -g | head -2
          '

      # A runtime drop-in replaces OnBootSec with a 90 s timer, so the real timer and service run.
      - name: Check the self-destruct timer
        if: inputs.test_selfdestruct
        run: |
          IP=$(cat "$BENCH_STATE/$RUN_ID/ip")
          ssh -i "$BENCH_STATE/$RUN_ID/id_ed25519" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null "root@$IP" '
            set -e
            mkdir -p /run/systemd/system/bench-selfdestruct.timer.d
            printf "[Timer]\nOnBootSec=\nOnActiveSec=90s\n" \
              > /run/systemd/system/bench-selfdestruct.timer.d/test.conf
            systemctl daemon-reload
            systemctl restart bench-selfdestruct.timer
            systemctl list-timers bench-selfdestruct.timer --no-pager
          '
          for _ in $(seq 1 30); do
            if ! nix shell nixpkgs#hcloud --command hcloud server describe "bench-$RUN_ID" >/dev/null 2>&1; then
              echo "server deleted itself"
              exit 0
            fi
            sleep 10
          done
          echo "server still exists 5 min after the timer was set" >&2
          exit 1

      - name: Delete server
        if: always()
        run: nix shell nixpkgs#hcloud --command scripts/hetzner/down.sh "$RUN_ID"
